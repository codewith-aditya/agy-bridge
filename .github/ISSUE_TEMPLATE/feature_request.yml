name: Feature request
description: Propose a capability the bridge does not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Settings, endpoints or behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Which layer does this touch?
      options:
        - Translation (internal/translate)
        - HTTP surface (internal/server)
        - Configuration (internal/config)
        - Documentation only
        - Not sure
    validations:
      required: true
